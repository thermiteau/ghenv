[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghenv"
version = "0.0.2"
description = "GitHub environment variable and secret management tool for bidirectional synchronization"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Thermite" }
]
dependencies = [
    "pynacl>=1.6.0",
    "requests>=2.32.4",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "requests-mock>=1.10.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
ghenv-check = "ghenv.check:main"
ghenv-create = "ghenv.create:main"
ghenv-update = "ghenv.update:main"
ghenv-delete = "ghenv.delete:main"

[tool.uv]
dev-dependencies = [
    "pyright>=1.1.390",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py310"
src = ["src"]
line-length = 99

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["ghenv"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src"]
reportMissingImports = "warning"

[tool.hatch.build.targets.wheel]
packages = ["src/ghenv"]
